name: Temporary upstream refresh
on:
  push:
    branches:
      - agent/upstream-sync-shell-refresh-perf-20261024-r2
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge-upstream:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/upstream-sync-shell-refresh-perf-20261024-r2
          fetch-depth: 0
      - name: Merge latest upstream main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/AAswordman/Operit2.git
          git fetch upstream main
          git merge --no-edit upstream/main
          git push origin HEAD:agent/upstream-sync-shell-refresh-perf-20261024-r2
