name: Android Flutter Build
# aijiang build trigger 2026-10-22 (secrets configured)

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fix-android-shell-exitcode-timeout
      - agent/upstream-sync-shell-refresh-perf-20261024
      - agent/upstream-sync-shell-refresh-perf-20261024-r2

permissions:
  contents: read

jobs:
  build-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            curl \
            diffutils \
            flex \
            gawk \
            gzip \
            patch \
            pkg-config \
            tar \
            unzip \
            xz-utils

      - name: Fetch Android runtime sources
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 1

  build-v8-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      V8_FROM_SOURCE: "1"
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/rusty-v8-android-source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android

      - name: Install V8 source-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl git gzip libglib2.0-dev pkg-config python3 unzip
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y libclang-21-dev
          test -f "$LIBCLANG_PATH/libclang.so"

      - name: Build Android ARM64 V8 from source
        run: |
          set -euo pipefail
          mkdir -p .ci-tools/rusty-v8-android/src
          cat > .ci-tools/rusty-v8-android/Cargo.toml <<'EOF'
          [package]
          name = "operit-rusty-v8-android-artifact"
          version = "0.1.0"
          edition = "2021"

          [workspace]

          [dependencies]
          v8 = "=152.2.0"
          EOF
          cat > .ci-tools/rusty-v8-android/src/main.rs <<'EOF'
          fn main() {}
          EOF
          cargo fetch --manifest-path .ci-tools/rusty-v8-android/Cargo.toml
          python3 - <<'PY'
          from pathlib import Path
          import glob
          import os
          roots = glob.glob(os.path.expanduser("~/.cargo/registry/src/*/v8-152.2.0"))
          if not roots:
              raise SystemExit("v8-152.2.0 source was not downloaded by cargo fetch")
          build_rs = Path(roots[0]) / "build.rs"
          source = build_rs.read_text()
          needle = "fn run_gn_gen(gn_args: &[String]) -> PathBuf {\n  let dirs = get_dirs();\n"
          if needle not in source:
              raise SystemExit("Could not find rusty_v8 GN generation hook to patch")
          patch = """  let gclient_args_path = dirs.root.join("build/config/gclient_args.gni");
          let mut gclient_args = fs::read_to_string(&gclient_args_path).unwrap_or_default();
          if !gclient_args.contains("android_ndk_version =") {
            gclient_args.push_str("\\ndeclare_args() {\\n  android_ndk_version = \\"2@30.0.16248370\\"\\n}\\n");
            fs::write(&gclient_args_path, gclient_args).expect("failed to provide android_ndk_version to GN");
          }
          // The crates.io V8 source archive omits generated Python dependency manifests
          // referenced by Chromium GN files. Create placeholders for literal pydeps_file entries.
          fn fill_pydeps(dir: &Path, count: &mut usize) {
            let Ok(entries) = fs::read_dir(dir) else { return; };
            for entry in entries.flatten() {
              let path = entry.path();
              if path.is_dir() {
                fill_pydeps(&path, count);
              } else if path.extension().and_then(|x| x.to_str()) == Some("gn") {
                let Ok(source) = fs::read_to_string(&path) else { continue; };
                for line in source.lines() {
                  let line = line.trim();
                  let Some((_, rhs)) = line.split_once("pydeps_file =") else { continue; };
                  let relative = rhs.trim().trim_matches('"');
                  if !relative.ends_with(".pydeps") || relative.contains("$") { continue; }
                  let target = path.parent().unwrap().join(relative);
                  if !target.exists() {
                    if let Some(parent) = target.parent() {
                      fs::create_dir_all(parent).expect("failed to create pydeps parent directory");
                    }
                    fs::write(&target, "").expect("failed to create missing pydeps placeholder");
                    *count += 1;
                  }
                }
              }
            }
          }
          let mut missing_pydeps = 0usize;
          fill_pydeps(&dirs.root, &mut missing_pydeps);
          println!("Created {missing_pydeps} missing generated pydeps placeholders");
          """
          source = source.replace(needle, needle + patch, 1)
          build_rs.write_text(source)
          print("Patched rusty_v8 source build to declare Chromium's Android NDK GN argument")
          PY
          cargo build --manifest-path .ci-tools/rusty-v8-android/Cargo.toml --target aarch64-linux-android --release
          build_root="$CARGO_TARGET_DIR/aarch64-linux-android/release/gn_out"
          lib="$build_root/obj/librusty_v8.a"
          binding="$build_root/src_binding.rs"
          test -s "$lib"
          test -s "$binding"
          mkdir -p target/operit-build-tools/rusty-v8-android
          gzip -n -c "$lib" > target/operit-build-tools/rusty-v8-android/librusty_v8_release_aarch64-linux-android.a.gz
          cp "$binding" target/operit-build-tools/rusty-v8-android/src_binding_release_aarch64-linux-android.rs
          ls -lh target/operit-build-tools/rusty-v8-android

      - name: Upload Android V8 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-rusty-v8-android-${{ github.sha }}
          path: target/operit-build-tools/rusty-v8-android/*
          if-no-files-found: error
          retention-days: 1

  build-android:
    needs: [build-android-runtime, build-v8-android]
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: apps/flutter/app/android/app/src/main

      - name: Download Android V8 source-build artifacts
        uses: actions/download-artifact@v4
        with:
          name: operit2-rusty-v8-android-${{ github.sha }}
          path: target/operit-build-tools/rusty-v8-android

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack pnpm shim
        shell: pwsh
        run: |
          corepack enable pnpm
          $enableCode = $LASTEXITCODE
          if ($enableCode -ne 0) { throw "corepack enable pnpm failed with exit $enableCode" }

          corepack prepare pnpm@10.7.0 --activate
          $prepareCode = $LASTEXITCODE
          if ($prepareCode -ne 0) { throw "corepack prepare pnpm@10.7.0 failed with exit $prepareCode" }

          $pnpmPath = Get-Command pnpm -ErrorAction SilentlyContinue
          if ($null -eq $pnpmPath) { throw "pnpm is still not discoverable after Corepack activation" }
          Write-Host "PowerShell pnpm path: $($pnpmPath.Source)"

          $psVersion = (& pnpm --version | Out-String).Trim()
          $psCode = $LASTEXITCODE
          if ($psCode -ne 0) { throw "PowerShell pnpm --version failed with exit $psCode" }
          Write-Host "PowerShell pnpm version: $psVersion"

          $cmdVersion = (& cmd.exe /d /c "pnpm --version" | Out-String).Trim()
          $cmdCode = $LASTEXITCODE
          if ($cmdCode -ne 0) { throw "cmd.exe cannot resolve pnpm (exit $cmdCode)" }
          Write-Host "cmd.exe pnpm version: $cmdVersion"
          if ($psVersion -ne "10.7.0" -or $cmdVersion -ne "10.7.0") {
            throw "Expected pnpm 10.7.0; got PowerShell='$psVersion', cmd.exe='$cmdVersion'"
          }

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Prepare Android bindgen libclang
        shell: pwsh
        run: |
          $version = "21.1.8"
          $packageName = "libclang.runtime.win-x64.$version"
          $toolsDir = "target/operit-build-tools"
          $packageDir = Join-Path $toolsDir $packageName
          $archive = Join-Path $toolsDir "$packageName.nupkg"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/$version" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $packageDir -Force
          $libclang = Join-Path $packageDir "runtimes/win-x64/native/libclang.dll"
          if (-not (Test-Path -LiteralPath $libclang)) {
            throw "Android bindgen libclang was not prepared at $libclang"
          }

      - name: Restore Android signing material
        shell: pwsh
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          $required = @(
            "ANDROID_RELEASE_KEYSTORE_BASE64",
            "ANDROID_RELEASE_STORE_PASSWORD",
            "ANDROID_RELEASE_KEY_ALIAS",
            "ANDROID_RELEASE_KEY_PASSWORD"
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub Actions secrets: $($missing -join ', ')"
          }
          $secretsDir = "tools/release/secrets"
          New-Item -ItemType Directory -Force -Path $secretsDir | Out-Null
          $keystore = Join-Path $secretsDir "operit2-release.keystore"
          [System.IO.File]::WriteAllBytes($keystore, [System.Convert]::FromBase64String($env:ANDROID_RELEASE_KEYSTORE_BASE64))
          @"
          RELEASE_STORE_FILE=operit2-release.keystore
          RELEASE_STORE_PASSWORD=$env:ANDROID_RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$env:ANDROID_RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$env:ANDROID_RELEASE_KEY_PASSWORD
          "@ | Set-Content -Path (Join-Path $secretsDir "android-signing.properties") -Encoding utf8

      - name: Install TypeScript compiler (.ci-tools)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-tools/typescript | Out-Null
          Push-Location .ci-tools/typescript
          npm init -y | Out-Null
          npm install typescript@5 --no-audit --no-fund
          Pop-Location
          $tsc = '.ci-tools/typescript/node_modules/.bin/tsc.cmd'
          if (-not (Test-Path $tsc)) { throw "tsc.cmd missing at $tsc" }
          & $tsc --version
      - name: Install plugin build dependencies (pnpm)
        shell: pwsh
        run: |
          $dirs = Get-ChildItem -Path plugins/packages/buildin -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'package.json') }
          Write-Host "found $($dirs.Count) plugin package(s)"
          foreach ($d in $dirs) {
            Write-Host "=== pnpm install: $($d.Name) ==="
            Push-Location $d.FullName
            corepack pnpm install --frozen-lockfile
            $code = $LASTEXITCODE
            if ($code -eq 0 -and (Test-Path 'node_modules/esbuild/install.js')) {
              Write-Host 'esbuild postinstall (pnpm10 blocks build scripts)'
              node node_modules/esbuild/install.js
            }
            Pop-Location
            if ($code -ne 0) { throw "pnpm install failed in $($d.Name) with exit $code" }
          }
          $ts = 'plugins/packages/buildin/workflow/node_modules/typescript/package.json'
          if (-not (Test-Path $ts)) { throw "typescript missing at $ts" }
          Write-Host 'plugin build dependencies ready'
      - name: Create Python venv for build hooks
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          if (-not (Test-Path '.\.venv\Scripts\python.exe')) { throw 'venv python missing' }
          .\.venv\Scripts\python.exe plugins/tools/sync_plugin_packages.py --help
      - name: Diagnostic - prepack workflow toolpkg
        shell: pwsh
        run: |
          Push-Location plugins/packages/buildin/workflow
          corepack pnpm install --frozen-lockfile
          if (Test-Path 'node_modules/esbuild/install.js') { node node_modules/esbuild/install.js }
          Write-Host '--- node_modules check ---'
          foreach ($m in @('typescript','esbuild','fflate')) {
            $p = "node_modules/$m"
            if (Test-Path $p) { Write-Host "OK  $m" } else { Write-Host "MISS $m" }
          }
          Write-Host '--- tsc version ---'
          corepack pnpm exec tsc --version
          Write-Host '--- esbuild smoke test ---'
          node -e "const e=require('esbuild');console.log('esbuild', e.version)"
          Write-Host '--- STEP 1: tsc -p tsconfig.json ---'
          $out = & node node_modules/typescript/bin/tsc -p tsconfig.json 2>&1 | Out-String
          $c1 = $LASTEXITCODE
          Write-Host "exit=$c1"
          Write-Host $out
          if ($c1 -ne 0) { Pop-Location; throw "tsc tsconfig.json failed ($c1)" }

          Write-Host '--- STEP 2: tsc -p web/tsconfig.json ---'
          $out2 = & node node_modules/typescript/bin/tsc -p web/tsconfig.json 2>&1 | Out-String
          $c2 = $LASTEXITCODE
          Write-Host "exit=$c2"
          Write-Host $out2
          if ($c2 -ne 0) { Pop-Location; throw "tsc web failed ($c2)" }

          Write-Host '--- STEP 3: build:web ---'
          $out3 = & corepack pnpm run build:web 2>&1 | Out-String
          $c3 = $LASTEXITCODE
          Write-Host "exit=$c3"
          Write-Host $out3
          Pop-Location
          if ($c3 -ne 0) { throw "build:web failed ($c3)" }
          Write-Host 'ALL THREE STEPS PASSED'
      - name: Check build environment
        shell: pwsh
        run: python tools/build_scripts/check_build_environment.py --products app --github-runner

      - name: Build and package Android app
        shell: pwsh
        env:
          RUSTY_V8_ARCHIVE: "${{ github.workspace }}/target/operit-build-tools/rusty-v8-android"
        run: |
          $version = (Select-String -Path apps/flutter/app/pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$').Matches
          if ($version.Count -ne 1) {
            throw "apps/flutter/app/pubspec.yaml must contain exactly one release version line"
          }
          python tools/build_scripts/build_flutter_android.py --build-name $version[0].Groups[1].Value --build-number $version[0].Groups[2].Value --enforce-lockfile

      - name: Verify native C++ ABI symbols in the bridge library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = Get-ChildItem -Path tools/release/dist -Filter 'operit2-app-android-arm64-v8a-*.apk' | Select-Object -First 1
          if ($null -eq $apk) { throw 'APK not found for symbol verification' }
          Write-Host "verifying $($apk.FullName)"

          $work = Join-Path $env:RUNNER_TEMP 'abi-check'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $zip = Join-Path $work 'app.apk'
          Copy-Item $apk.FullName $zip
          Expand-Archive -Path $zip -DestinationPath $work -Force

          $so = Join-Path $work 'lib/arm64-v8a/liboperit_flutter_bridge.so'
          if (-not (Test-Path $so)) { throw "liboperit_flutter_bridge.so missing from APK" }

          $nm = Get-ChildItem -Path $env:ANDROID_NDK_HOME -Recurse -Filter 'llvm-nm.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $nm) {
            $nm = Get-ChildItem -Path $env:ANDROID_NDK_ROOT -Recurse -Filter 'llvm-nm.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -eq $nm) { throw 'llvm-nm not found in the NDK' }
          Write-Host "using $($nm.FullName)"

          $symbols = & $nm.FullName --undefined-only --dynamic $so 2>&1 | Out-String
          Write-Host '--- undefined C++ ABI symbols ---'
          Write-Host $symbols

          $targets = @(
            '_ZTISt13runtime_error',
            '_ZTVSt13runtime_error',
            '__cxa_throw',
            '__cxa_allocate_exception',
            '_ZTISt9exception',
            '_ZTISt9bad_alloc'
          )
          $missing = @()
          foreach ($t in $targets) {
            if ($symbols -match [regex]::Escape($t)) { $missing += $t }
          }
          if ($missing.Count -gt 0) {
            "## FAILED: unresolved C++ ABI symbols" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $missing | ForEach-Object { "- ``$_``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
            throw "unresolved C++ ABI symbols: $($missing -join ', ')"
          }

          Write-Host 'C++ ABI symbols resolved in the bridge library'
          "## C++ ABI symbol check passed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-${{ github.sha }}
          path: tools/release/dist/operit2-app-android-arm64-v8a-*.apk
          if-no-files-found: error
          retention-days: 14
